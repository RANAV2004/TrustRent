services:
  postgres:
    image: postgres:16-alpine
    container_name: trustrent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustrent_user
      POSTGRES_PASSWORD: trustrent_pass
      POSTGRES_DB: trustrent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustrent_user -d trustrent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
